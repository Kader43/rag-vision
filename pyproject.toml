[project]
name = "rag-vision"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch (>=2.14.1,<3.0.0)",
    "pymupdf (>=1.28.2,<2.0.0)",
    "byaldi (>=0.0.7,<0.0.8)",
    "qdrant-client (>=1.19.1,<2.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn (>=0.54.0,<0.55.0)"
]

[tool.poetry]
packages = [{include = "rag_vision", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
